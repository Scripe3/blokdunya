        R.onChildAdded(ref('cols'),f('added'),e);R.onChildChanged(ref('cols'),f('modified'),e)}})};
    return{db,room}
  }catch(e){console.warn('Firebase başlatılamadı',e);return null}
})());
const use=n=>fb().then(f=>f&&f[n]);
const colStr=(x,z)=>{let s='';for(let y=0;y<H;y++)s+=get(x,y,z).toString(16);return s};
async function flush(){if(flushing)return;flushing=true;
  while(dq.size){const k=dq.values().next().value;dq.delete(k);const[x,z]=k.split('_');
    try{await DB.collection('cols').doc(k).set({c:colStr(+x,+z)})}catch(e){onEl.textContent='⚠️ Kaydedilemedi: '+((e&&e.code)||'hata');warnUntil=performance.now()+5000}}
  flushing=false}
function saveCol(x,z){if(!DB)return;dq.add(x+'_'+z);flush()}
function mk(col){const g=new THREE.Group(),bx=(w,h,d,c,y,z)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshBasicMaterial({color:c}));m.position.set(0,y,z||0);return m};
  const body=bx(.5,1.3,.3,col,.65);g.userData={body,col:col.clone(),f:0};g.add(body,bx(.5,.5,.5,0xf1c9a0,1.55),bx(.2,.1,.1,0x333333,1.5,-.28));scene.add(g);return g}
function updateOthers(){
  if(!ROOM)return;const seen=new Set();
  for(const p of ROOM.peers()){const q=p.presence;if(p.sameTab||p.kind!='viewer'||typeof q.x!='number'||typeof q.y!='number'||typeof q.z!='number')continue;
    seen.add(p.peer);let g=others.get(p.peer);
    if(!g){let h=0;for(const c of p.peer)h=(h*31+c.charCodeAt(0))>>>0;g=mk(new THREE.Color().setHSL((h%360)/360,.7,.5));g.position.set(q.x,q.y,q.z);others.set(p.peer,g)}
    g.position.x+=(q.x-g.position.x)*.25;g.position.y+=(q.y-g.position.y)*.25;g.position.z+=(q.z-g.position.z)*.25;g.rotation.y=+q.r||0;const u=g.userData;u.body.material.color.copy(performance.now()<u.f?RED:u.col);
    const nm=clean(q.n)||'Oyuncu';if(u.nm!==nm){if(u.lb){g.remove(u.lb);u.lb.material.map.dispose();u.lb.material.dispose()}u.lb=label(nm);g.add(u.lb);u.nm=nm}}
  for(const[k,g]of others)if(!seen.has(k)){scene.remove(g);others.delete(k)}
  const t='🟢 Çevrimiçi · '+(seen.size+1)+' oyuncu';if(performance.now()>warnUntil&&onEl.textContent!==t)onEl.textContent=t}
// PvP: vuruş menzili 4 blok; hasarı alan taraf kendi damage() fonksiyonuyla uygular
function pvpHit(){
  const cp=Math.cos(pitch),d=[-Math.sin(yaw)*cp,Math.sin(pitch),-Math.cos(yaw)*cp];
  for(let t=0;t<4;t+=.1){const X=px+d[0]*t,Y=py+1.62+d[1]*t,Z=pz+d[2]*t;
    if(get(Math.floor(X),Math.floor(Y),Math.floor(Z)))return null;
    for(const[k,g]of others)if(Math.abs(X-g.position.x)<.4&&Y>g.position.y&&Y<g.position.y+1.9&&Math.abs(Z-g.position.z)<.4)return k}
  return null}
function attack(k){
  const n=performance.now();if(!ROOM||n-lastAtk<450)return;lastAtk=n;
  const g=others.get(k);if(g)g.userData.f=n+150;
  ROOM.emit('hit',{to:k}).catch(()=>{})}
function sendPresence(now){
  if(!ROOM||now-lastP<100)return;lastP=now;
  const v={x:+px.toFixed(2),y:+py.toFixed(2),z:+pz.toFixed(2),r:+yaw.toFixed(2),n:myName},j=JSON.stringify(v);
  if(j!==lastS){lastS=j;ROOM.presence(v).catch(()=>{})}}
// adlar ve sohbet (metinler textContent ile basılır, uzunluklar sınırlı)
const clean=s=>String(s||'').replace(/[\u0000-\u001f<>]/g,'').trim().slice(0,16);
const cleanMsg=s=>String(s||'').replace(/[\u0000-\u001f]/g,'').trim().slice(0,120);
let chatOpen=false,myName='Oyuncu'+(100+Math.floor(Math.random()*900));
try{myName=clean(localStorage.getItem('bd_name'))||myName}catch(e){}
function label(txt){const c=document.createElement('canvas');c.width=256;c.height=64;const x=c.getContext('2d');x.font='bold 34px sans-serif';x.textAlign='center';
  const w=Math.min(250,x.measureText(txt).width+24);x.fillStyle='rgba(0,0,0,.5)';x.fillRect(128-w/2,8,w,48);x.fillStyle='#fff';x.fillText(txt,128,44,230);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false,transparent:true}));sp.scale.set(1.6,.4,1);sp.position.y=2.2;sp.renderOrder=10;return sp}
const chatEl=document.getElementById('chat'),cbox=document.getElementById('chatbox'),cin=document.getElementById('chatin'),nbox=document.getElementById('namebox'),nin=document.getElementById('namein');
function addMsg(n,m){const d=document.createElement('div'),b=document.createElement('b');b.textContent=n+': ';d.append(b,document.createTextNode(m));chatEl.appendChild(d);while(chatEl.children.length>6)chatEl.firstChild.remove();setTimeout(()=>d.remove(),12000)}
function openChat(){if(chatOpen||nbox.style.display=='none'===false)return;chatOpen=true;jx=jy=0;document.exitPointerLock&&document.exitPointerLock();cbox.style.display='flex';cin.value='';cin.focus()}
function closeChat(){chatOpen=false;cbox.style.display='none';cin.blur()}
function sendChat(){const m=cleanMsg(cin.value);if(m){if(ROOM&&ROOM.chat)ROOM.chat.send(myName,m).catch(()=>{});else addMsg(myName,m)}closeChat()}
cin.onkeydown=e=>{if(e.key=='Enter'){e.preventDefault();sendChat()}else if(e.key=='Escape')closeChat()};
document.getElementById('chatsend').onpointerdown=e=>{e.preventDefault();sendChat()};
document.getElementById('chatbtn').onpointerdown=e=>{e.stopPropagation();chatOpen?closeChat():openChat()};
nin.value=myName;
const startGame=()=>{myName=clean(nin.value)||myName;try{localStorage.setItem('bd_name',myName)}catch(e){}nbox.style.display='none'};
document.getElementById('namego').onclick=startGame;nin.onkeydown=e=>{if(e.key=='Enter')startGame()};
chunkTick(40);
(async()=>{
  DB=await use('db');
  if(DB)DB.collection('cols').onSnapshot(snap=>{snap.docChanges().forEach(ch=>{
    if(ch.type=='removed')return;const[x,z]=ch.doc.id.split('_').map(Number),c=(ch.doc.data()||{}).c;
    if(typeof c!='string'||c.length!=H)return;
    let chg=false;for(let y=0;y<H;y++){const v=parseInt(c[y],16)||0;if(inb(x,y,z)&&W[x+z*N+y*N*N]!=v){W[x+z*N+y*N*N]=v;chg=true}}if(chg)markDirty(x,z);})},e=>{onEl.textContent='⚠️ Dünya yüklenemedi: '+((e&&e.code)||'hata');warnUntil=performance.now()+8000});
  ROOM=await use('room');
  if(ROOM&&ROOM.chat)ROOM.chat.onMsg(v=>{if(Date.now()-v.t<30000)addMsg(clean(v.n)||'Oyuncu',cleanMsg(v.m))});
  if(ROOM)ROOM.on('hit',m=>{
    const ps=ROOM.peers(),me=ps.find(p=>p.sameTab),from=ps.find(p=>p.peer==m.peer);
    if(m.isMe||!me||!from||!m.data||m.data.to!==me.peer)return;
    const q=from.presence,t=performance.now();
    if(typeof q.x!='number'||typeof q.y!='number'||typeof q.z!='number'||Math.hypot(q.x-px,q.z-pz)>6||Math.abs(q.y-py)>4)return;
    if(t-(lastFrom[m.peer]||0)<350)return;lastFrom[m.peer]=t;
    damage('pvp',4);
    const dx=px-q.x,dz=pz-q.z,l=Math.hypot(dx,dz)||1;kbx=dx/l*8;kbz=dz/l*8;vy=Math.max(vy,5);ground=false});
  if(!DB&&!ROOM)onEl.textContent='⚪ Çevrimdışı (tek oyunculu)';
  else if(DB&&!ROOM)onEl.textContent='🟢 Ortak dünya (oyuncular görünmüyor)';
  else if(!DB)onEl.textContent='🟡 Oyuncular görünür, bloklar ortak değil';
})();
let last=performance.now();
(function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min((now-last)/1000,.05);last=now;
  let f=-jy+(keys.w?1:0)-(keys.s?1:0),s=jx+(keys.d?1:0)-(keys.a?1:0);
  if(invOpen||chatOpen)f=s=0;const l=Math.hypot(f,s);if(l>1){f/=l;s/=l}
  const sp=4.5,sy=Math.sin(yaw),cy=Math.cos(yaw);
  const mx=(-sy*f+cy*s)*sp*dt+kbx*dt,mz=(-cy*f-sy*s)*sp*dt+kbz*dt;kbx*=.9;kbz*=.9;
  if(!hit(px+mx,py,pz))px+=mx;
  if(!hit(px,py,pz+mz))pz+=mz;
  vy-=25*dt;if(keys[' ']&&ground)vy=8;
  const ny=py+vy*dt;ground=false;
  if(hit(px,ny,pz)){if(vy<0){ground=true;damage('fall',peak-py)}vy=0;peak=py}
  else{py=ny;peak=Math.max(peak,py)}
  if(py<-10)damage('void',99);
  // Minecraft tarzı kırma: basılı tut, sertliğe göre süre; havada 5 kat yavaş; ana kaya kırılamaz
  const hold=(mouseHold||(look&&!place&&look.m<12&&now-look.t>200))&&!invOpen&&!chatOpen&&now>mineCool;let mining=false;
  if(hold){const r0=ray();
    if(r0&&inb(...r0.b)){const hd=HARD[get(...r0.b)],k=r0.b.join();
      if(hd&&isFinite(hd)){mining=true;if(mine.k!=k){mine.k=k;mine.p=0}
        mine.p+=dt/(hd*(ground?1:5));mineFill.style.width=Math.min(100,mine.p*100)+'%';
        if(mine.p>=1){set(...r0.b,0);markDirty(r0.b[0],r0.b[2]);saveCol(r0.b[0],r0.b[2]);mine.k='';mineCool=now+250;mining=false}}}}
  if(!mining)mine.k='';mineEl.style.display=mining?'block':'none';
  cam.position.set(px,py+1.62,pz);cam.rotation.set(pitch,yaw,0);
  const r=ray();hl.visible=!!r;if(r)hl.position.set(r.b[0]+.5,r.b[1]+.5,r.b[2]+.5);
  chunkTick();updateOthers();sendPresence(now);
  renderer.render(scene,cam);
})(last);
